<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b6b7c" />
  <meta name="description" content="Temporizador Tabata e Intervalos para Sport&amp;Nature" />
  <meta name="app-version" content="1.3.0-cf" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tabata S&amp;N" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>Sport&amp;Nature — Tabata Timer</title>
  <style>
    :root {
      /* Colores corporativos extraídos del logo de Sport&Nature */
      --sn-teal: #0b6b7c;
      --sn-teal-light: #3b8ea5;
      --sn-green: #4fb865;
      --sn-green-dark: #2f8544;
      --sn-rest: #e05252;
      --sn-prep: #f59e0b;
      --sn-dark: #111827;
      --sn-gray: #64748b;
      --sn-bg: #f8fafb;
      --sn-line: #e2e8f0;

      --active-color: var(--sn-teal);
      --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-nums: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100vh;
      background: var(--sn-bg);
      color: var(--sn-dark);
      font-family: var(--font-sans);
      overflow: hidden;
      transition: background-color 0.35s ease, color 0.35s ease;
    }

    /* Colores por fase: planos, limpios y muy legibles en TV */
    body[data-phase="idle"] {
      --active-color: var(--sn-teal);
      background-color: #f8fafb;
    }
    body[data-phase="prep"] {
      --active-color: var(--sn-prep);
      background-color: #fffbeb;
    }
    body[data-phase="work"] {
      --active-color: var(--sn-green);
      background-color: #eefbf1;
    }
    body[data-phase="rest"] {
      --active-color: var(--sn-rest);
      background-color: #fef2f2;
    }
    body[data-phase="setrest"] {
      --active-color: var(--sn-teal-light);
      background-color: #f0f9ff;
    }
    body[data-phase="done"] {
      --active-color: var(--sn-teal);
      background-color: #f0fdf4;
    }

    /* Estructura a pantalla completa 16:9 sin tarjetas ni bordes recargados */
    .screen {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2.2vh 3.5vw 3vh;
    }

    /* 1. CABECERA LIMPIA CON EL LOGO OFICIAL */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: #ffffff;
      padding: 12px 24px;
      border-radius: 18px;
      box-shadow: 0 4px 20px rgba(11, 107, 124, 0.06);
    }

    .brand-logo {
      height: clamp(42px, 6vh, 64px);
      width: auto;
      display: block;
      object-fit: contain;
    }

    /* Reloj de hora actual (destacado en modo pantalla completa / TV) */
    .wall-clock {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      border-radius: 14px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      user-select: none;
    }

    .wall-clock-icon {
      width: clamp(22px, 2.2vw, 32px);
      height: clamp(22px, 2.2vw, 32px);
      color: var(--sn-teal);
      flex-shrink: 0;
    }

    .wall-clock-time {
      font-family: var(--font-nums);
      font-size: clamp(1.35rem, 2vw, 2.2rem);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: var(--sn-teal);
      line-height: 1;
    }

    /* En modo Pantalla Completa (TV) hacemos la hora actual aún más grande y visible */
    :fullscreen .wall-clock,
    body.is-fullscreen .wall-clock {
      background: var(--sn-dark);
      border-color: var(--sn-dark);
      padding: 10px 24px;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.18);
    }

    :fullscreen .wall-clock-icon,
    body.is-fullscreen .wall-clock-icon {
      color: var(--sn-green);
      width: clamp(26px, 2.6vw, 38px);
      height: clamp(26px, 2.6vw, 38px);
    }

    :fullscreen .wall-clock-time,
    body.is-fullscreen .wall-clock-time {
      color: #ffffff;
      font-size: clamp(1.75rem, 2.6vw, 2.8rem);
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 12px;
      font-family: var(--font-sans);
      font-size: clamp(0.9rem, 1.05vw, 1.1rem);
      font-weight: 700;
      padding: 11px 22px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
      user-select: none;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--sn-teal);
      color: #ffffff;
      padding: 11px 30px;
      font-size: clamp(0.95rem, 1.15vw, 1.2rem);
    }

    .btn-primary:hover {
      background: #095968;
    }

    .btn-ghost {
      background: #f1f5f9;
      color: #334155;
    }

    .btn-ghost:hover {
      background: #e2e8f0;
    }

    .btn-ghost.active {
      background: #e0f2fe;
      color: var(--sn-teal);
    }

    .btn-ghost.muted {
      color: #94a3b8;
      text-decoration: line-through;
    }

    /* Control de volumen independiente para la app */
    .volume-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f1f5f9;
      border-radius: 12px;
      padding: 9px 14px;
      transition: opacity 0.2s ease, background-color 0.15s ease;
      user-select: none;
    }

    .volume-control:hover {
      background: #e2e8f0;
    }

    .volume-control.is-muted {
      opacity: 0.45;
    }

    .volume-icon {
      font-size: 1rem;
      line-height: 1;
    }

    .volume-slider {
      width: clamp(68px, 6.5vw, 96px);
      height: 6px;
      accent-color: var(--sn-teal);
      cursor: pointer;
    }

    .volume-val {
      font-family: var(--font-nums);
      font-size: clamp(0.8rem, 0.9vw, 0.92rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #334155;
      min-width: 36px;
      text-align: right;
    }

    /* 2. CENTRO GIGANTE MINIMALISTA: ESTADO + TIEMPO + DATOS */
    .center-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      user-select: none;
    }

    .phase-label {
      font-size: clamp(1.5rem, 3.2vw, 3.2rem);
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--active-color);
      transition: color 0.3s ease;
    }

    .halfway-badge {
      display: none;
      margin-top: 6px;
      padding: 6px 20px;
      border-radius: 999px;
      background: var(--sn-prep);
      color: #ffffff;
      font-weight: 800;
      font-size: clamp(1rem, 1.8vw, 1.6rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .halfway-badge.show {
      display: inline-block;
    }

    .giant-time {
      font-family: var(--font-nums);
      font-size: clamp(9rem, 32vw, 48vh);
      font-weight: 900;
      line-height: 0.88;
      letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
      color: var(--sn-dark);
      margin: 1vh 0 2vh;
      transition: transform 0.2s ease;
    }

    @keyframes halfwayPop {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); color: var(--sn-prep); }
    }

    .giant-time.flash {
      animation: halfwayPop 0.55s ease-in-out 2;
    }

    /* Fila limpia de métricas debajo del reloj */
    .metrics-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(28px, 6vw, 90px);
    }

    .metric-item {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .metric-name {
      font-size: clamp(0.95rem, 1.4vw, 1.5rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--sn-gray);
    }

    .metric-val {
      font-size: clamp(1.7rem, 3vw, 3.2rem);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: var(--sn-dark);
    }

    .metric-val small {
      font-size: 0.65em;
      font-weight: 700;
      color: var(--sn-gray);
    }

    /* 3. PARTE INFERIOR: BARRA DE INTERVALO + LÍNEA DE TIEMPO GLOBAL LIMPIA */
    .bottom-bars {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.4vh;
    }

    /* Barra del intervalo actual */
    .current-bar-track {
      width: 100%;
      height: clamp(22px, 3.2vh, 36px);
      background: rgba(15, 23, 42, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .current-bar-half {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 3px;
      background: rgba(15, 23, 42, 0.28);
      z-index: 2;
    }

    .current-bar-fill {
      height: 100%;
      width: 100%;
      background: var(--active-color);
      border-radius: 999px;
      transition: width 0.08s linear, background-color 0.3s ease;
    }

    /* Línea de tiempo de toda la sesión (una sola barra segmentada muy clara) */
    .session-timeline-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .session-timeline-labels {
      display: flex;
      justify-content: space-between;
      font-size: clamp(0.82rem, 1.05vw, 1.05rem);
      font-weight: 700;
      color: var(--sn-gray);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .session-timeline-track {
      width: 100%;
      height: clamp(20px, 2.8vh, 32px);
      display: flex;
      gap: 4px;
      border-radius: 10px;
      overflow: hidden;
    }

    .tl-block {
      height: 100%;
      background: rgba(15, 23, 42, 0.09);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      min-width: 4px;
    }

    .tl-block[data-type="prep"]    { background: rgba(245, 158, 11, 0.2); }
    .tl-block[data-type="work"]    { background: rgba(79, 184, 101, 0.22); }
    .tl-block[data-type="rest"]    { background: rgba(224, 82, 82, 0.18); }
    .tl-block[data-type="setrest"] { background: rgba(59, 142, 165, 0.22); }

    .tl-block-fill {
      height: 100%;
      width: 0%;
      transition: width 0.08s linear;
    }

    .tl-block[data-type="prep"] .tl-block-fill    { background: var(--sn-prep); }
    .tl-block[data-type="work"] .tl-block-fill    { background: var(--sn-green); }
    .tl-block[data-type="rest"] .tl-block-fill    { background: var(--sn-rest); }
    .tl-block[data-type="setrest"] .tl-block-fill { background: var(--sn-teal-light); }

    .tl-block.current {
      outline: 2px solid var(--sn-dark);
      outline-offset: -2px;
    }

    /* 4. PANEL DE AJUSTES DESPLEGABLE (LIMPIO Y MINIMALISTA) */
    .settings-drawer {
      display: none;
      background: #ffffff;
      border-radius: 18px;
      padding: 16px 22px;
      box-shadow: 0 10px 30px rgba(11, 107, 124, 0.1);
      margin-top: 6px;
    }

    .settings-drawer.open {
      display: block;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 14px;
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 8px;
      border-radius: 12px;
      background: #f8fafc;
    }

    .setting-label {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--sn-gray);
    }

    .stepper {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .step-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: var(--sn-dark);
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .step-btn:hover {
      background: var(--sn-teal);
      color: #ffffff;
      border-color: var(--sn-teal);
    }

    .step-input {
      width: 58px;
      border: none;
      background: transparent;
      text-align: center;
      font-family: var(--font-nums);
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--sn-dark);
    }

    @media (max-width: 960px) {
      .settings-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* VISTA MÓVIL OPTIMIZADA (Sin alterar nada de la vista Desktop/TV) */
    @media (max-width: 768px) {
      html, body {
        height: auto;
        min-height: 100dvh;
        overflow-x: hidden;
        overflow-y: auto;
      }

      .screen {
        width: 100%;
        height: auto;
        min-height: 100dvh;
        padding: 12px 14px 20px;
        gap: 14px;
      }

      /* Cabecera tipo App móvil con cuadrícula 2x2 de botones */
      .topbar {
        flex-direction: column;
        align-items: center;
        padding: 14px 14px;
        gap: 12px;
        border-radius: 18px;
      }

      .brand-logo {
        height: 40px;
        max-width: 82%;
        margin: 0 auto;
      }

      .top-controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        width: 100%;
      }

      .top-controls .btn {
        width: 100%;
        justify-content: center;
        padding: 12px 10px;
        font-size: 0.92rem;
        border-radius: 12px;
      }

      .volume-control {
        grid-column: 1 / -1;
        width: 100%;
        justify-content: space-between;
        padding: 10px 14px;
      }

      .volume-slider {
        flex: 1;
        width: auto;
      }

      /* En móvil ocultamos el botón TV y el reloj de sala (el móvil ya muestra su hora arriba) */
      #btnFullscreen,
      .wall-clock {
        display: none;
      }

      /* Centro del reloj adaptado al formato vertical de móvil */
      .center-stage {
        padding: 10px 0;
        width: 100%;
      }

      .phase-label {
        font-size: 1.4rem;
        letter-spacing: 0.1em;
      }

      .halfway-badge {
        font-size: 0.9rem;
        padding: 5px 14px;
      }

      .giant-time {
        font-size: clamp(5.2rem, 26vw, 7.6rem);
        line-height: 0.95;
        margin: 8px 0 16px;
      }

      /* Las 3 métricas en 3 tarjetas iguales para que no se pisen en pantallas estrechas */
      .metrics-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        width: 100%;
      }

      .metric-item {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        background: rgba(255, 255, 255, 0.78);
        padding: 10px 6px;
        border-radius: 14px;
        box-shadow: 0 2px 10px rgba(11, 107, 124, 0.05);
      }

      .metric-name {
        font-size: 0.7rem;
        letter-spacing: 0.06em;
      }

      .metric-val {
        font-size: 1.35rem;
      }

      /* Barras inferiores adaptadas a móvil */
      .bottom-bars {
        gap: 12px;
      }

      .current-bar-track {
        height: 20px;
      }

      .session-timeline-labels {
        flex-direction: column;
        align-items: flex-start;
        gap: 3px;
        font-size: 0.74rem;
      }

      .session-timeline-track {
        height: 22px;
        gap: 3px;
      }

      /* Panel de ajustes cómodo para el pulgar en móvil */
      .settings-drawer {
        padding: 14px 12px;
        border-radius: 16px;
      }

      .settings-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .setting-item {
        padding: 10px 6px;
      }

      .step-btn {
        width: 36px;
        height: 36px;
        font-size: 1.2rem;
      }

      .step-input {
        width: 48px;
        font-size: 1.15rem;
      }
    }
  </style>
</head>

              <input type="number" id="inpSetRest" class="step-input" min="0" max="3600" value="60" />
              <button type="button" class="step-btn" data-input="inpSetRest" data-delta="10">+</button>

        <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-top:14px; padding-top:12px; border-top:1px solid #e2e8f0;">
          <span style="font-size:0.8rem; font-weight:800; color:var(--sn-gray); text-transform:uppercase; letter-spacing:0.05em;">
            🔊 Probar voces y efectos animados:
          </span>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button type="button" class="btn btn-ghost" style="padding:7px 14px; font-size:0.85rem;" id="btnTestPrep">⏱️ "¡Preparados!"</button>
            <button type="button" class="btn btn-ghost" style="padding:7px 14px; font-size:0.85rem;" id="btnTestWork">🔥 "¡Empezamos!"</button>
            <button type="button" class="btn btn-ghost" style="padding:7px 14px; font-size:0.85rem;" id="btnTestHalf">⚡ "¡Mitad!"</button>
            <button type="button" class="btn btn-ghost" style="padding:7px 14px; font-size:0.85rem;" id="btnTestRest">😌 "¡Descanso!"</button>
            <button type="button" class="btn btn-ghost" style="padding:7px 14px; font-size:0.85rem;" id="btnTestEnd">🏆 "¡Final!"</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    (() => {
      'use strict';

      // =========================================================================
      // 1. MOTOR DE SONIDO DE ALTA POTENCIA PARA SALA + VOZ DE ENTRENADOR
      // =========================================================================
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.outNode = null;
          this.outputGain = null;
          this.volume = 1.0;
          this.keepAliveOsc = null;
          this.keepAliveGain = null;
          this.pendingSpeech = null;
          this.pendingSpeechTimeout = null;
          // mode: 'voice-sfx' (Voz + Efectos) | 'sfx-only' (Solo Efectos) | 'muted' (Silencio)
          this.mode = 'voice-sfx';
          this.esVoice = null;
          this.initVoices();
        }

        _calcOutputGain() {
          if (this.volume <= 0) return 0;
          // Curva perceptual suave: 0% = silencio, 50% ≈ mitad percibida, 100% = máxima potencia (1.0)
          return Math.pow(this.volume, 1.6);
        }

        setVolume(v) {
          this.volume = Math.min(1, Math.max(0, Number(v) || 0));
          if (this.ctx && this.outputGain) {
            this.outputGain.gain.setTargetAtTime(this._calcOutputGain(), this.ctx.currentTime, 0.015);
          }
        }

        initVoices() {
          if (!('speechSynthesis' in window)) return;
          const pickSpanishVoice = () => {
            const voices = window.speechSynthesis.getVoices() || [];
            const esVoices = voices.filter(v => /^es([-_]|$)/i.test(v.lang));
            if (esVoices.length > 0) {
              this.esVoice =
                esVoices.find(v => /natural|online|google|helena|elvira|alvaro|pablo|monica|jorge/i.test(v.name) && /es[-_]ES/i.test(v.lang)) ||
                esVoices.find(v => /es[-_]ES/i.test(v.lang)) ||
                esVoices[0];
            }
          };
          pickSpanishVoice();
          window.speechSynthesis.onvoiceschanged = pickSpanishVoice;
        }

        init() {
          if (!this.ctx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (Ctx) {
              this.ctx = new Ctx();
              // Etapa de potencia con compresor de gimnasio y pre-amplificación (3.2x)
              const compressor = this.ctx.createDynamicsCompressor();
              compressor.threshold.setValueAtTime(-26, this.ctx.currentTime);
              compressor.knee.setValueAtTime(10, this.ctx.currentTime);
              compressor.ratio.setValueAtTime(14, this.ctx.currentTime);
              compressor.attack.setValueAtTime(0.002, this.ctx.currentTime);
              compressor.release.setValueAtTime(0.14, this.ctx.currentTime);

              const preGain = this.ctx.createGain();
              preGain.gain.setValueAtTime(3.2, this.ctx.currentTime);

              const outputGain = this.ctx.createGain();
              outputGain.gain.setValueAtTime(this._calcOutputGain(), this.ctx.currentTime);

              preGain.connect(compressor);
              compressor.connect(outputGain);
              outputGain.connect(this.ctx.destination);
              this.outNode = preGain;
              this.outputGain = outputGain;
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
        }

        // Mantiene vivo el motor de audio en segundo plano (sin pausar Spotify ni consumir MediaSession)
        startKeepAlive() {
          this.init();
          if (!this.ctx || this.keepAliveOsc) return;
          try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1, this.ctx.currentTime);
            gain.gain.setValueAtTime(0.00001, this.ctx.currentTime);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            this.keepAliveOsc = osc;
            this.keepAliveGain = gain;
          } catch (_) {}
        }

        stopKeepAlive() {
          if (this.keepAliveOsc) {
            try { this.keepAliveOsc.stop(); this.keepAliveOsc.disconnect(); } catch (_) {}
            this.keepAliveOsc = null;
          }
          if (this.keepAliveGain) {
            try { this.keepAliveGain.disconnect(); } catch (_) {}
            this.keepAliveGain = null;
          }
        }

        cancelPendingSpeech() {
          this.pendingSpeech = null;
          if (this.pendingSpeechTimeout) {
            clearTimeout(this.pendingSpeechTimeout);
            this.pendingSpeechTimeout = null;
          }
        }

        _runSpeechNow(text, rate, pitch) {
          if (this.mode !== 'voice-sfx' || this.volume <= 0 || !('speechSynthesis' in window)) return;
          try {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            if (this.esVoice) utter.voice = this.esVoice;
            utter.lang = this.esVoice?.lang || 'es-ES';
            utter.rate = rate;
            utter.pitch = pitch;
            utter.volume = Math.min(1, Math.max(0, this.volume));
            window.speechSynthesis.speak(utter);
          } catch (_) {}
        }

        flushSpeech(now = Date.now()) {
          if (this.pendingSpeech && now >= this.pendingSpeech.at) {
            const item = this.pendingSpeech;
            this.cancelPendingSpeech();
            this._runSpeechNow(item.text, item.rate, item.pitch);
          }
        }

        // Pronunciar frase con energía de entrenador de gimnasio (disparable también desde segundo plano)
        speak(text, delayMs = 0, rate = 1.1, pitch = 1.05) {
          if (this.mode !== 'voice-sfx' || !('speechSynthesis' in window)) return;
          this.cancelPendingSpeech();
          if (delayMs > 0) {
            this.pendingSpeech = { at: Date.now() + delayMs, text, rate, pitch };
            this.pendingSpeechTimeout = setTimeout(() => {
              this.flushSpeech(Date.now());
            }, delayMs);
          } else {
            this._runSpeechNow(text, rate, pitch);
          }
        }

        // Nota sintetizada con SOSTENIMIENTO REAL (sustain = 0.85) para proyectar máximo volumen en sala
        playNote({ freq, freqEnd = null, duration = 0.25, type = 'sawtooth', delay = 0, vol = 0.9, sustain = 0.85 }) {
          this.init();
          if (!this.ctx || !this.outNode || this.mode === 'muted' || this.volume <= 0) return;

          const start = this.ctx.currentTime + delay;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, start);
          if (freqEnd !== null) {
            osc.frequency.exponentialRampToValueAtTime(Math.max(40, freqEnd), start + duration);
          }

          const holdEnd = start + Math.max(0.015, duration * sustain);
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.linearRampToValueAtTime(vol, start + 0.008);
          gain.gain.setValueAtTime(vol, holdEnd);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

          osc.connect(gain);
          gain.connect(this.outNode);

          osc.start(start);
          osc.stop(start + duration + 0.03);
        }

        // Bocina + Campana de alta penetración acústica (banda 800Hz - 2600Hz ideal para altavoces de TV y sala)
        playGymHornBlast(delay = 0, duration = 0.72, baseFreq = 880) {
          // Osciladores desafinados (sawtooth + square) que cortan cualquier música de fondo
          this.playNote({ freq: baseFreq * 0.5, duration, type: 'sawtooth', delay, vol: 0.95, sustain: 0.88 });
          this.playNote({ freq: baseFreq,       duration, type: 'square',   delay, vol: 0.95, sustain: 0.88 });
          this.playNote({ freq: baseFreq * 1.006, duration, type: 'sawtooth', delay, vol: 0.9,  sustain: 0.88 });
          this.playNote({ freq: baseFreq * 1.5, duration, type: 'sawtooth', delay, vol: 0.75, sustain: 0.85 });
          this.playNote({ freq: baseFreq * 2.0, duration: duration * 0.9, type: 'triangle', delay, vol: 0.7, sustain: 0.8 });
        }

        // 1. PREPARACIÓN ("¡Preparados!")
        startPrep() {
          [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
            this.playNote({ freq: f, duration: 0.16, type: 'square', delay: i * 0.09, vol: 0.8, sustain: 0.8 });
            this.playNote({ freq: f, duration: 0.18, type: 'sawtooth', delay: i * 0.09, vol: 0.65, sustain: 0.8 });
          });
          this.speak('¡Preparados!', 380, 1.08, 1.05);
        }

        // 2. CUENTA ATRÁS 3 - 2 - 1 ("Tres", "Dos", "Uno")
        pip(secLeft = 0) {
          this.playNote({ freq: 987.77, duration: 0.13, type: 'square',   delay: 0, vol: 0.85, sustain: 0.82 });
          this.playNote({ freq: 1975.5, duration: 0.13, type: 'triangle', delay: 0, vol: 0.6,  sustain: 0.8 });

          if (secLeft === 3) this.speak('Tres', 0, 1.22, 1.05);
          else if (secLeft === 2) this.speak('Dos', 0, 1.22, 1.08);
          else if (secLeft === 1) this.speak('Uno', 0, 1.22, 1.12);
        }

        // 3. ARRANCAR TRABAJO (Doble impacto + Bocina potente de pabellón + Voz "¡Empezamos!")
        startWork(round = 1, totalRounds = 8) {
          // Doble llamada rápida + Bocinazo largo súper potente en La5/Mi6
          this.playNote({ freq: 659.25, duration: 0.11, type: 'square',   delay: 0.00, vol: 0.95, sustain: 0.85 });
          this.playNote({ freq: 1318.5, duration: 0.11, type: 'sawtooth', delay: 0.00, vol: 0.85, sustain: 0.85 });

          this.playNote({ freq: 783.99, duration: 0.11, type: 'square',   delay: 0.13, vol: 0.95, sustain: 0.85 });
          this.playNote({ freq: 1567.98, duration: 0.11, type: 'sawtooth', delay: 0.13, vol: 0.85, sustain: 0.85 });

          // Bocinazo principal sostenido (0.75s a máxima potencia)
          this.playGymHornBlast(0.26, 0.75, 1046.50);

          if (round === 1) {
            this.speak('¡Empezamos! ¡Vamos!', 920, 1.08, 1.08);
          } else if (round === totalRounds && totalRounds > 1) {
            this.speak('¡Último ejercicio! ¡A tope!', 920, 1.08, 1.1);
          } else {
            this.speak(`¡Empezamos! Ejercicio ${round}`, 920, 1.1, 1.06);
          }
        }

        // 4. MITAD DE TIEMPO ("¡Mitad!")
        halfway() {
          // Triple pitido agudo penetrante ("¡Bip-Bip-BIIIP!")
          const notes = [
            { f: 1174.66, d: 0.11, t: 0.00 },
            { f: 1396.91, d: 0.11, t: 0.13 },
            { f: 1760.00, d: 0.34, t: 0.26 }
          ];
          notes.forEach(n => {
            this.playNote({ freq: n.f, duration: n.d, type: 'square',   delay: n.t, vol: 0.92, sustain: 0.85 });
            this.playNote({ freq: n.f * 0.5, duration: n.d, type: 'sawtooth', delay: n.t, vol: 0.7, sustain: 0.85 });
          });

          this.speak('¡Mitad!', 560, 1.12, 1.1);
        }

        // 5. DESCANSO ("¡Descanso!")
        startRest(isSetRest = false) {
          // Doble bocina descendente clara y potente (La5 -> Re5)
          this.playNote({ freq: 880.00, duration: 0.22, type: 'square',   delay: 0.00, vol: 0.9,  sustain: 0.85 });
          this.playNote({ freq: 440.00, duration: 0.22, type: 'sawtooth', delay: 0.00, vol: 0.8,  sustain: 0.85 });

          this.playNote({ freq: 587.33, duration: 0.52, type: 'square',   delay: 0.24, vol: 0.95, sustain: 0.85 });
          this.playNote({ freq: 293.66, duration: 0.52, type: 'sawtooth', delay: 0.24, vol: 0.85, sustain: 0.85 });

          if (isSetRest) {
            this.speak('¡Fin de serie! Recupera', 760, 1.06, 1.0);
          } else {
            this.speak('¡Descanso!', 740, 1.06, 1.0);
          }
        }

        // 6. FINAL DEL ENTRENAMIENTO (Triple Bocinazo de Final de Partido + Fanfarria Larga + Voz)
        finish() {
          // 3 bocinazos potentes + gran acorde final sostenido de 1.1 segundos
          this.playGymHornBlast(0.00, 0.24, 783.99);
          this.playGymHornBlast(0.28, 0.24, 987.77);
          this.playGymHornBlast(0.56, 0.24, 1174.66);
          this.playGymHornBlast(0.84, 1.05, 1318.51);

          this.speak('¡Tiempo! ¡Entrenamiento completado, buen trabajo!', 1850, 1.06, 1.06);
        }
      }

      const sound = new SoundEngine();

      // 2. Estado y Elementos
      const ui = {
        phaseLabel: document.getElementById('phaseLabel'),
        halfwayBadge: document.getElementById('halfwayBadge'),
        clockDisplay: document.getElementById('clockDisplay'),
        roundNow: document.getElementById('roundNow'),
        roundTotal: document.getElementById('roundTotal'),
        setNow: document.getElementById('setNow'),
        setTotal: document.getElementById('setTotal'),
        totalRemaining: document.getElementById('totalRemaining'),

        halfMark: document.getElementById('halfMark'),
        currentBarFill: document.getElementById('currentBarFill'),
        timelineSummary: document.getElementById('timelineSummary'),
        timelineProgressText: document.getElementById('timelineProgressText'),
        sessionTimelineTrack: document.getElementById('sessionTimelineTrack'),

        btnStartPause: document.getElementById('btnStartPause'),
        btnReset: document.getElementById('btnReset'),
        btnSettings: document.getElementById('btnSettings'),
        btnSound: document.getElementById('btnSound'),
        volumeControl: document.getElementById('volumeControl'),
        volumeIcon: document.getElementById('volumeIcon'),
        volumeSlider: document.getElementById('volumeSlider'),
        volumeVal: document.getElementById('volumeVal'),
        btnFullscreen: document.getElementById('btnFullscreen'),
        settingsDrawer: document.getElementById('settingsDrawer'),

        btnTestPrep: document.getElementById('btnTestPrep'),
        btnTestWork: document.getElementById('btnTestWork'),
        btnTestHalf: document.getElementById('btnTestHalf'),
        btnTestRest: document.getElementById('btnTestRest'),
        btnTestEnd: document.getElementById('btnTestEnd'),

        inpPrep: document.getElementById('inpPrep'),
        inpWork: document.getElementById('inpWork'),
        inpRest: document.getElementById('inpRest'),
        inpCycles: document.getElementById('inpCycles'),
        inpSets: document.getElementById('inpSets'),
        inpSetRest: document.getElementById('inpSetRest')
      };

      const PHASE_TITLES = {
        idle: 'PREPARADO',
        prep: 'PREPARACIÓN',
        work: '¡TRABAJO!',
        rest: 'DESCANSO',
        setrest: 'DESCANSO DE SERIE',
        done: '¡SESIÓN COMPLETADA!'
      };

      const DEFAULT_TITLE = 'Sport&Nature — Tabata Timer';

      let steps = [];
      let totalMs = 0;
      let stepIndex = 0;
      let remMs = 0;
      let stepEndTime = 0;
      let running = false;
      let rafId = null;
      let timerWorker = null;
      let timerWorkerUrl = null;
      let fallbackIntervalId = null;
      let wakeLockSentinel = null;
      let pipsFired = new Set();
      let halfwayFired = false;

      let tlBlocks = [];
      let tlFills = [];

      async function acquireWakeLock() {
        if (!('wakeLock' in navigator) || document.hidden || !running) return;
        try {
          if (wakeLockSentinel) return;
          wakeLockSentinel = await navigator.wakeLock.request('screen');
          wakeLockSentinel.addEventListener('release', () => {
            wakeLockSentinel = null;
          });
        } catch (_) {
          wakeLockSentinel = null;
        }
      }

      function releaseWakeLock() {
        if (wakeLockSentinel) {
          wakeLockSentinel.release().catch(() => {});
          wakeLockSentinel = null;
        }
      }

      function startBackgroundClock() {
        stopBackgroundClock();
        try {
          const workerSrc = `
            let id = null;
            self.onmessage = (e) => {
              if (e.data === 'start') {
                if (id) clearInterval(id);
                id = setInterval(() => self.postMessage('tick'), 100);
              } else if (e.data === 'stop') {
                if (id) clearInterval(id);
                id = null;
              }
            };
          `;
          const blob = new Blob([workerSrc], { type: 'application/javascript' });
          timerWorkerUrl = URL.createObjectURL(blob);
          timerWorker = new Worker(timerWorkerUrl);
          timerWorker.onmessage = () => tick();
          timerWorker.postMessage('start');
        } catch (_) {
          timerWorker = null;
        }
        // Respaldo adicional por si algún entorno restringe Web Workers
        fallbackIntervalId = setInterval(() => tick(), 250);
      }

      function stopBackgroundClock() {
        if (timerWorker) {
          try {
            timerWorker.postMessage('stop');
            timerWorker.terminate();
          } catch (_) {}
          timerWorker = null;
        }
        if (timerWorkerUrl) {
          try { URL.revokeObjectURL(timerWorkerUrl); } catch (_) {}
          timerWorkerUrl = null;
        }
        if (fallbackIntervalId) {
          clearInterval(fallbackIntervalId);
          fallbackIntervalId = null;
        }
      }

      function stopTimers() {
        stopBackgroundClock();
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
      }

      function getCfg() {
        const num = (el, min, def) => {
          const v = parseInt(el.value, 10);
          return Number.isNaN(v) ? def : Math.max(min, v);
        };
        return {
          prep: num(ui.inpPrep, 0, 10),
          work: num(ui.inpWork, 1, 40),
          rest: num(ui.inpRest, 0, 20),
          cycles: num(ui.inpCycles, 1, 8),
          sets: num(ui.inpSets, 1, 1),
          setRest: num(ui.inpSetRest, 0, 60)
        };
      }

      function fmtMMSS(sec) {
        const s = Math.max(0, Math.ceil(sec));
        return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
      }

      function buildWorkout() {
        const cfg = getCfg();
        const list = [];

        if (cfg.prep > 0) list.push({ type: 'prep', sec: cfg.prep, round: 1, set: 1 });

        for (let s = 1; s <= cfg.sets; s++) {
          for (let c = 1; c <= cfg.cycles; c++) {
            list.push({ type: 'work', sec: cfg.work, round: c, set: s });
            if (c < cfg.cycles && cfg.rest > 0) {
              list.push({ type: 'rest', sec: cfg.rest, round: c, set: s });
            }
          }
          if (s < cfg.sets && cfg.setRest > 0) {
            list.push({ type: 'setrest', sec: cfg.setRest, round: cfg.cycles, set: s });
          }
        }

        steps = list;
        totalMs = list.reduce((a, b) => a + b.sec * 1000, 0);
        stepIndex = 0;
        remMs = steps.length ? steps[0].sec * 1000 : 0;
        pipsFired.clear();
        halfwayFired = false;
        ui.halfwayBadge.classList.remove('show');

        ui.timelineSummary.textContent = `Sesión: ${cfg.work}s Trabajo · ${cfg.rest}s Descanso · ${cfg.cycles} Ejercicios` +
          (cfg.sets > 1 ? ` · ${cfg.sets} Series` : '');

        // Construir bloques de la barra de línea de tiempo
        ui.sessionTimelineTrack.innerHTML = '';
        tlBlocks = [];
        tlFills = [];

        steps.forEach((st, idx) => {
          const blk = document.createElement('div');
          blk.className = 'tl-block';
          blk.dataset.type = st.type;
          blk.style.flexGrow = String(Math.max(1, st.sec));
          blk.title = `${PHASE_TITLES[st.type]} · Ejercicio ${st.round} (${st.sec}s)`;

          const fill = document.createElement('div');
          fill.className = 'tl-block-fill';
          blk.appendChild(fill);

          blk.addEventListener('click', () => {
            stepIndex = idx;
            remMs = steps[stepIndex].sec * 1000;
            pipsFired.clear();
            halfwayFired = false;
            ui.halfwayBadge.classList.remove('show');
            if (running) {
              stepEndTime = Date.now() + remMs;
              playStepStartSound(steps[stepIndex]);
            }
            render();
          });

          ui.sessionTimelineTrack.appendChild(blk);
          tlBlocks.push(blk);
          tlFills.push(fill);
        });

        try { localStorage.setItem('sportnature_minimal_v4', JSON.stringify(cfg)); } catch (_) {}
        render();
      }

      function render() {
        const cfg = getCfg();
        ui.roundTotal.textContent = cfg.cycles;
        ui.setTotal.textContent = cfg.sets;

        if (!steps.length) return;

        if (stepIndex >= steps.length) {
          document.body.setAttribute('data-phase', 'done');
          ui.phaseLabel.textContent = PHASE_TITLES.done;
          ui.clockDisplay.textContent = '00:00';
          ui.currentBarFill.style.width = '100%';
          ui.totalRemaining.textContent = '00:00';
          ui.btnStartPause.textContent = '↺ REPETIR';
          tlBlocks.forEach((b, i) => {
            b.classList.remove('current');
            tlFills[i].style.width = '100%';
          });
          ui.timelineProgressText.textContent = `100% completado (${fmtMMSS(totalMs / 1000)} / ${fmtMMSS(totalMs / 1000)})`;
          document.title = DEFAULT_TITLE;
          return;
        }

        const cur = steps[stepIndex];
        const stepDurMs = cur.sec * 1000;
        const isIdle = !running && stepIndex === 0 && remMs === stepDurMs;
        const phase = isIdle ? 'idle' : cur.type;

        document.body.setAttribute('data-phase', phase);
        ui.phaseLabel.textContent = PHASE_TITLES[phase];
        ui.halfMark.style.display = cur.type === 'work' ? 'block' : 'none';

        const secDisplay = Math.ceil(Math.max(0, remMs) / 1000 - 0.001);
        ui.clockDisplay.textContent = fmtMMSS(secDisplay);
        document.title = running
          ? `${fmtMMSS(secDisplay)} · ${PHASE_TITLES[phase]} — Sport&Nature`
          : DEFAULT_TITLE;

        const pctStepLeft = stepDurMs > 0 ? Math.max(0, Math.min(100, (remMs / stepDurMs) * 100)) : 0;
        ui.currentBarFill.style.width = `${pctStepLeft}%`;

        ui.roundNow.textContent = cur.round;
        ui.setNow.textContent = cur.set;

        // Progreso global en la línea de tiempo
        let elapsedBefore = 0;
        for (let i = 0; i < stepIndex; i++) elapsedBefore += steps[i].sec * 1000;
        const elapsedInCur = Math.max(0, stepDurMs - remMs);
        const elapsedTotal = Math.min(totalMs, elapsedBefore + elapsedInCur);
        const remTotalSec = Math.max(0, (totalMs - elapsedTotal) / 1000);
        const pctGlobal = totalMs > 0 ? Math.floor((elapsedTotal / totalMs) * 100) : 0;

        ui.totalRemaining.textContent = fmtMMSS(remTotalSec);
        ui.timelineProgressText.textContent = `${pctGlobal}% completado (${fmtMMSS(elapsedTotal / 1000)} / ${fmtMMSS(totalMs / 1000)})`;

        for (let i = 0; i < steps.length; i++) {
          if (i < stepIndex) {
            tlBlocks[i].classList.remove('current');
            tlFills[i].style.width = '100%';
          } else if (i === stepIndex) {
            tlBlocks[i].classList.add('current');
            tlFills[i].style.width = `${100 - pctStepLeft}%`;
          } else {
            tlBlocks[i].classList.remove('current');
            tlFills[i].style.width = '0%';
          }
        }
      }

      function playStepStartSound(step) {
        pipsFired.clear();
        halfwayFired = false;
        ui.halfwayBadge.classList.remove('show');
        const cfg = getCfg();
        if (step.type === 'prep') sound.startPrep();
        else if (step.type === 'work') sound.startWork(step.round, cfg.cycles);
        else if (step.type === 'rest') sound.startRest(false);
        else if (step.type === 'setrest') sound.startRest(true);
      }

      function checkCues(step, prevMs, newMs) {
        const halfMs = (step.sec * 1000) / 2;

        if (step.type === 'work' && step.sec >= 6 && !halfwayFired && prevMs > halfMs && newMs <= halfMs) {
          halfwayFired = true;
          if (halfMs - newMs < 2000) {
            sound.halfway();
            ui.halfwayBadge.classList.add('show');
            ui.clockDisplay.classList.remove('flash');
            void ui.clockDisplay.offsetWidth;
            ui.clockDisplay.classList.add('flash');
            setTimeout(() => ui.halfwayBadge.classList.remove('show'), 2200);
          }
        }

        if (step.sec >= 4 && newMs > 0) {
          const sLeft = Math.ceil(newMs / 1000);
          if ((sLeft === 3 || sLeft === 2 || sLeft === 1) && !pipsFired.has(sLeft)) {
            pipsFired.add(sLeft);
            const nearHalf = step.type === 'work' && Math.abs(halfMs - sLeft * 1000) < 350;
            if (!nearHalf) sound.pip(sLeft);
          }
        }
      }

      // Motor de tiempo basado en hora real (Date.now) + Web Worker: sigue contando y pitando en segundo plano
      function tick() {
        if (!running) return;
        const now = Date.now();
        sound.flushSpeech(now);

        const cur = steps[stepIndex];
        if (!cur) return;

        const prev = remMs;
        remMs = stepEndTime - now;

        checkCues(cur, prev, remMs);

        while (remMs <= 0) {
          const over = -remMs;
          stepIndex++;
          if (stepIndex < steps.length) {
            const nextStep = steps[stepIndex];
            stepEndTime += nextStep.sec * 1000;
            remMs = stepEndTime - now;

            if (remMs > 0) {
              pipsFired.clear();
              halfwayFired = false;
              ui.halfwayBadge.classList.remove('show');

              const elapsedInNext = nextStep.sec * 1000 - remMs;
              if (elapsedInNext < 2500) {
                playStepStartSound(nextStep);
              } else {
                // Si el SO suspendió la app varios segundos, sincroniza sin disparar avisos atrasados
                const nextHalfMs = (nextStep.sec * 1000) / 2;
                if (remMs <= nextHalfMs) halfwayFired = true;
                for (let s = 3; s >= 1; s--) {
                  if (remMs <= (s - 1) * 1000) pipsFired.add(s);
                }
              }
            }
          } else {
            remMs = 0;
            running = false;
            stopTimers();
            sound.stopKeepAlive();
            releaseWakeLock();
            if (over < 10000) sound.finish();
            render();
            return;
          }
        }

        render();
      }

      function uiLoop() {
        if (!running) {
          rafId = null;
          return;
        }
        tick();
        if (!document.hidden && running) {
          rafId = requestAnimationFrame(uiLoop);
        } else {
          rafId = null;
        }
      }

      function start() {
        sound.init();
        sound.startKeepAlive();
        if (stepIndex >= steps.length) buildWorkout();
        const atStart = stepIndex === 0 && remMs === steps[0].sec * 1000;
        running = true;
        stepEndTime = Date.now() + remMs;
        ui.btnStartPause.textContent = '⏸ PAUSAR';
        ui.settingsDrawer.classList.remove('open');
        ui.btnSettings.classList.remove('active');

        if (atStart) playStepStartSound(steps[0]);
        acquireWakeLock();
        startBackgroundClock();
        if (!document.hidden && !rafId) rafId = requestAnimationFrame(uiLoop);
      }

      function pause() {
        if (running) {
          remMs = Math.max(0, stepEndTime - Date.now());
        }
        running = false;
        stopTimers();
        sound.stopKeepAlive();
        sound.cancelPendingSpeech();
        releaseWakeLock();
        ui.btnStartPause.textContent = '▶ CONTINUAR';
        render();
      }

      function reset() {
        pause();
        stepIndex = 0;
        remMs = steps.length ? steps[0].sec * 1000 : 0;
        stepEndTime = 0;
        pipsFired.clear();
        halfwayFired = false;
        ui.halfwayBadge.classList.remove('show');
        ui.btnStartPause.textContent = '▶ EMPEZAR';
        render();
      }

      // Al volver de Spotify u otra pestaña, re-sincronizamos al instante, reactivamos audio y Wake Lock
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && running) {
          sound.init();
          sound.startKeepAlive();
          acquireWakeLock();
          tick();
          if (!rafId && running) rafId = requestAnimationFrame(uiLoop);
        }
      });

      // 3. Eventos
      ui.btnStartPause.addEventListener('click', () => running ? pause() : start());
      ui.btnReset.addEventListener('click', reset);

      ui.btnSettings.addEventListener('click', () => {
        const isOpen = ui.settingsDrawer.classList.toggle('open');
        ui.btnSettings.classList.toggle('active', isOpen);
        if (isOpen && window.innerWidth <= 768) {
          setTimeout(() => {
            ui.settingsDrawer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }, 50);
        }
      });

      // Ciclar modo de audio: Voz + Sonido -> Solo Sonido -> Silencio
      function syncAudioUI() {
        if (sound.mode === 'voice-sfx') {
          ui.btnSound.classList.remove('muted');
          ui.btnSound.textContent = '🗣️ Voz + Sonido';
          ui.volumeControl.classList.remove('is-muted');
        } else if (sound.mode === 'sfx-only') {
          ui.btnSound.classList.remove('muted');
          ui.btnSound.textContent = '🎵 Solo Sonido';
          ui.volumeControl.classList.remove('is-muted');
        } else {
          ui.btnSound.classList.add('muted');
          ui.btnSound.textContent = '🔇 Silencio';
          ui.volumeControl.classList.add('is-muted');
        }
      }

      function applyVolumePct(pct) {
        const clamped = Math.min(100, Math.max(0, Math.round(Number(pct) || 0)));
        ui.volumeSlider.value = String(clamped);
        ui.volumeVal.textContent = `${clamped}%`;
        ui.volumeIcon.textContent = clamped === 0 ? '🔇' : clamped < 40 ? '🔈' : clamped < 75 ? '🔉' : '🔊';
        sound.setVolume(clamped / 100);
        if (clamped > 0 && sound.mode === 'muted') {
          sound.mode = 'voice-sfx';
          syncAudioUI();
        }
      }

      ui.btnSound.addEventListener('click', () => {
        if (sound.mode === 'voice-sfx') {
          sound.mode = 'sfx-only';
        } else if (sound.mode === 'sfx-only') {
          sound.mode = 'muted';
          sound.cancelPendingSpeech();
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        } else {
          sound.mode = 'voice-sfx';
          if (sound.volume === 0) applyVolumePct(100);
        }
        syncAudioUI();
      });

      ui.volumeSlider.addEventListener('input', () => {
        applyVolumePct(ui.volumeSlider.value);
      });

      ui.volumeSlider.addEventListener('change', () => {
        const val = parseInt(ui.volumeSlider.value, 10) || 0;
        applyVolumePct(val);
        try { localStorage.setItem('sportnature_volume_v1', String(val)); } catch (_) {}
        if (val > 0 && !running) sound.pip(0);
        ui.volumeSlider.blur();
      });

      // Botones de prueba en el cajón de tiempos
      ui.btnTestPrep.addEventListener('click', () => sound.startPrep());
      ui.btnTestWork.addEventListener('click', () => sound.startWork(1, getCfg().cycles));
      ui.btnTestHalf.addEventListener('click', () => sound.halfway());
      ui.btnTestRest.addEventListener('click', () => sound.startRest(false));
      ui.btnTestEnd.addEventListener('click', () => sound.finish());

      ui.btnFullscreen.addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
        else document.exitFullscreen?.();
      });

      document.addEventListener('fullscreenchange', () => {
        const isFs = Boolean(document.fullscreenElement);
        document.body.classList.toggle('is-fullscreen', isFs);
        ui.btnFullscreen.classList.toggle('active', isFs);
      });

      // Reloj con la hora actual en vivo (HH:MM)
      const wallClockTimeEl = document.getElementById('wallClockTime');
      function updateWallClock() {
        if (!wallClockTimeEl) return;
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        wallClockTimeEl.textContent = `${hh}:${mm}`;
      }
      updateWallClock();
      setInterval(updateWallClock, 1000);

      document.querySelectorAll('.step-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          if (running) pause();
          const inp = document.getElementById(btn.dataset.input);
          const delta = parseInt(btn.dataset.delta, 10);
          const min = parseInt(inp.min, 10) || 0;
          const max = parseInt(inp.max, 10) || 3600;
          inp.value = Math.min(max, Math.max(min, (parseInt(inp.value, 10) || 0) + delta));
          buildWorkout();
        });
      });

      [ui.inpPrep, ui.inpWork, ui.inpRest, ui.inpCycles, ui.inpSets, ui.inpSetRest].forEach(inp => {
        inp.addEventListener('input', () => {
          if (running) pause();
          buildWorkout();
        });
      });

      window.addEventListener('keydown', (e) => {
        if (document.activeElement?.tagName === 'INPUT' && document.activeElement.type !== 'range') return;
        if (e.code === 'Space') { e.preventDefault(); running ? pause() : start(); }
        else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); reset(); }
        else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); ui.btnFullscreen.click(); }
      });

      try {
        const savedVol = localStorage.getItem('sportnature_volume_v1');
        if (savedVol !== null) applyVolumePct(parseInt(savedVol, 10));
      } catch (_) {}

      try {
        const saved = JSON.parse(localStorage.getItem('sportnature_minimal_v4') || 'null');
        if (saved) {
          ui.inpPrep.value = saved.prep ?? 10;
          ui.inpWork.value = saved.work ?? 40;
          ui.inpRest.value = saved.rest ?? 20;
          ui.inpCycles.value = saved.cycles ?? 8;
          ui.inpSets.value = saved.sets ?? 1;
          ui.inpSetRest.value = saved.setRest ?? 60;
        }
      } catch (_) {}

      buildWorkout();

      // 4. Registro PWA (Service Worker + Botón de Instalación en Tablet/Móvil)
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }

      const btnInstallEl = document.getElementById('btnInstall');
      let deferredInstallPrompt = null;

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        if (btnInstallEl) btnInstallEl.style.display = 'inline-flex';
      });

      if (btnInstallEl) {
        btnInstallEl.addEventListener('click', async () => {
          if (!deferredInstallPrompt) return;
          deferredInstallPrompt.prompt();
          await deferredInstallPrompt.userChoice;
          deferredInstallPrompt = null;
          btnInstallEl.style.display = 'none';
        });
      }

      window.addEventListener('appinstalled', () => {
        deferredInstallPrompt = null;
        if (btnInstallEl) btnInstallEl.style.display = 'none';
      });
    })();
  </script>
</body>
</html>
